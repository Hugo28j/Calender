name: Update VUB TimeEdit calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/vub.ics'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: vub-timeedit-history
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current TimeEdit window
        env:
          TIMEEDIT_URL: https://cloud.timeedit.net/be_vub/web/public/ri626Q92Y29Z2XQ526862906y9Z293822X499X6Q229592226X9X22163n1X2X96272Q22ZZ2X639uX9Qw56u2662226260.ics
        run: |
          mkdir -p data
          curl --fail --location --retry 3 --retry-delay 3 "$TIMEEDIT_URL" -o /tmp/timeedit-live.ics
          grep -q "BEGIN:VCALENDAR" /tmp/timeedit-live.ics
          grep -q "BEGIN:VEVENT" /tmp/timeedit-live.ics
          grep -q "END:VCALENDAR" /tmp/timeedit-live.ics

      - name: Merge live timetable with permanent lesson history
        run: |
          python3 scripts/merge_timeedit.py data/vub.ics /tmp/timeedit-live.ics data/vub.ics
          grep -q "BEGIN:VCALENDAR" data/vub.ics
          grep -q "BEGIN:VEVENT" data/vub.ics
          grep -q "END:VCALENDAR" data/vub.ics

      - name: Commit calendar when changed
        run: |
          if [ -z "$(git status --porcelain -- data/vub.ics)" ]; then
            echo "Calendar did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vub.ics
          git commit -m "Update VUB TimeEdit calendar history"
          git push
